  <circle cx="30" cy="30" r="3" fill="#0ea5e9" />
  <circle cx="42" cy="18" r="2.5" fill="#a855f7" />
  
  <!-- Text: MoroAI -->
  <text x="68" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="26" fill="#ffffff" letter-spacing="-0.5">Moro<tspan fill="#38bdf8">AI</tspan></text>
